services:
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: surikat_wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SERVERURL=34.175.100.81
      - SERVERPORT=51900
      - PEERS=jaalvarez2818,alberto,airam,carlos,roberto
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=10.8.0.0/24
      # Rutas que reciben los peers: subnet VPN + surikat-vpn + surikat-network
      - ALLOWEDIPS=10.8.0.0/24,172.20.0.0/16,172.18.0.0/16
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules
    restart: always
    ports:
      - 51900:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      - vpn-network
      - surikat-network

networks:
  # Red propia de la VPN para servicios que no están en surikat-network.
  # WireGuard hace de gateway: enruta el tráfico VPN (10.8.0.0/24) hacia esta red.
  vpn-network:
    name: surikat-vpn
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

  # Red existente de los servicios de Surikat (172.18.0.0/16), accesible desde la VPN.
  surikat-network:
    external: true
