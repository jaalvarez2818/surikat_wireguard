services:
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: surikat_wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SERVERURL=34.175.100.81
      - SERVERPORT=51900
      - PEERS=jaalvarez2818,alberto,airam,carlos,roberto
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=10.8.0.0/24
      # Rutas que reciben los peers: subnet VPN + red Docker de servicios
      - ALLOWEDIPS=10.8.0.0/24,172.20.0.0/16
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules
    restart: always
    ports:
      - 51900:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      - vpn-network
      - surikat-network

  # ─── Añade aquí tus servicios conectándolos a vpn-network ────────────────
  #
  # Cada servicio en vpn-network recibe una IP de 172.20.x.x
  # Desde la VPN te conectas a esa IP (no al puerto mapeado en el host).
  #
  # Ejemplo postgres accesible desde VPN en 172.20.1.2:5432
  #
  # postgres:
  #   image: postgres:16
  #   container_name: surikat_postgres
  #   environment:
  #     POSTGRES_PASSWORD: secret
  #   ports:
  #     - "5434:5432"   # opcional, para acceso desde el host
  #   networks:
  #     vpn-network:
  #       ipv4_address: 172.20.1.2   # IP fija para que no cambie al reiniciar
  #   restart: always

networks:
  # Red compartida entre WireGuard y todos los servicios que quieres exponer por VPN.
  # WireGuard hace de gateway: enruta el tráfico VPN (10.8.0.0/24) hacia esta red.
  vpn-network:
    name: surikat-vpn
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

  surikat-network:
    external: true
